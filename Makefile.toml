extend = [
  { path = "./build/common-tasks.toml" },
  { path = "./build/dist-tasks.toml" },
  { path = "./build/docker-tasks.toml", optional = true },
  { path = "./build/watch-tasks.toml", optional = true },
  { path = "./build/typst-tasks.toml", optional = true },
  { path = "./build/release-tasks.toml", optional = true },
]

# Name of output if/when calling dist tasks, should match the cargo bin output
env.PROJECT_NAME = "rust_template" # "cargo_output_binary_name_for_PROJECT_NAME"
# Default profile to use for builds during dist related tasks
env.SLEEP_TIME = "15"

# GitHub / repo metadata (set by setup.sh during template init)
env.GITHUB_USER = "mrdwarf7"
env.REPO_NAME = "rust_template.rs"                              # GitHub repo name (with .rs)
env.GITHUB_URL = "https://github.com/mrdwarf7/rust_template.rs"

# Changelog tool configuration
env.CHANGELOG_TOOL = "git-cliff"
env.CHANGELOG_ARGS_BASE = "--repository ${GITHUB_URL} --commit-path . --sort newest --strip all --with-commit"

# Identifies the first argument passed after `cargo` as, or inplace of `build`.
# ie: `cargo build <...zyx...>` vs. `cargo zigbuild <...xyz...>`
env.BUILD_ARG = "build"
# env.BUILD_ARG = "zigbuild"

env.PARALLEL_TASKS = false # true/false, if true will run tasks in parallel (if possible)

## START Full sweeps/aliases
[tasks.b]
run_task = { name = ["build"], parallel = "${PARALLEL_TASKS}" }

[tasks.br]
run_task = { name = ["build_release"], parallel = "${PARALLEL_TASKS}" }
[tasks.ba]
run_task = { name = [
  "build_workspace",
  "build",
  "build_release_workspace",
  "build_release",
], parallel = "${PARALLEL_TASKS}" }

[tasks.a]
run_task = { name = [
  "build_workspace",
  "build",
  "test",
  "build_release_workspace",
  "build_release",
  "test_all",
], parallel = "${PARALLEL_TASKS}" }

[tasks.A]
description = "Full verification sweep for the repository."
run_task = { name = [
  "format",
  "check",
  "clippy",
  "a",
], parallel = "${PARALLEL_TASKS}" }

[tasks.r]
run_task = { name = ["run"], parallel = "${PARALLEL_TASKS}" }
[tasks.rr]
run_task = { name = ["run_release"], parallel = "${PARALLEL_TASKS}" }

[tasks.bw]
run_task = { name = ["build_workspace"], parallel = "${PARALLEL_TASKS}" }

[tasks.brw]
run_task = { name = [
  "build_release_workspace",
], parallel = "${PARALLEL_TASKS}" }

[tasks.t]
run_task = { name = ["test"], parallel = "${PARALLEL_TASKS}" }

[tasks.ta]
run_task = { name = ["test_all"], parallel = "${PARALLEL_TASKS}" }

[tasks.tnc]
run_task = { name = ["test_no_capture"], parallel = "${PARALLEL_TASKS}" }

[tasks.tanc]
run_task = { name = ["test_all_no_capture"], parallel = "${PARALLEL_TASKS}" }

[tasks.f]
run_task = { name = ["format"], parallel = "${PARALLEL_TASKS}" }

[tasks.c]
run_task = { name = ["check"], parallel = "${PARALLEL_TASKS}" }

[tasks.cp]
run_task = { name = ["clippy"], parallel = "${PARALLEL_TASKS}" }

[tasks.cl]
run_task = { name = ["clean"], parallel = "${PARALLEL_TASKS}" }

[tasks.reset]
run_task = { name = ["clean", "a"], parallel = "${PARALLEL_TASKS}" }

[tasks.envs]
run_task = { name = "print_all", parallel = "${PARALLEL_TASKS}" }

[tasks.up]
run_task = { name = [
  "a",
  "docker_start",
  "sleep",
  "run_as_project",
], parallel = "${PARALLEL_TASKS}" }

[tasks.down]
run_task = { name = ["docker_stop"], parallel = "${PARALLEL_TASKS}" }

[tasks.dist]
env.PROFILE = "release"
run_task = { name = ["build_release_dist"], parallel = "${PARALLEL_TASKS}" }

## END Full sweeps/aliases

## START release tasks (delegated to release-tasks.toml)
# These are top-level aliases that call into release-tasks.toml

[tasks.bump]
description = "Bump patch version, update changelog, commit + tag (use bump_minor/bump_major for others)"
run_task = { name = ["bump_patch"], parallel = "${PARALLEL_TASKS}" }

[tasks.bump_patch]
run_task = { name = ["bump_patch"], parallel = "${PARALLEL_TASKS}" }

[tasks.bump_minor]
run_task = { name = ["bump_minor"], parallel = "${PARALLEL_TASKS}" }

[tasks.bump_major]
run_task = { name = ["bump_major"], parallel = "${PARALLEL_TASKS}" }

[tasks.changelog]
run_task = { name = ["changelog"], parallel = "${PARALLEL_TASKS}" }

[tasks.changelog_check]
run_task = { name = ["changelog_check"], parallel = "${PARALLEL_TASKS}" }

## END release tasks


## START typst tasks

[tasks.typb]
run_task = { name = ["typst_build"], parallel = "${PARALLEL_TASKS}" }

# [tasks.typcl]
# run_task = { name = ["typst_compile"], parallel = "${PARALLEL_TASKS}" }

[tasks.typw]
run_task = { name = ["typst_watch"], parallel = "${PARALLEL_TASKS}" }

[tasks.typnw]
run_task = { name = ["typst_watch_no_follow"], parallel = "${PARALLEL_TASKS}" }

[tasks.typc]
run_task = { name = ["typst_clean"], parallel = "${PARALLEL_TASKS}" }

[tasks.typcl]
run_task = { name = ["typst_clean"], parallel = "${PARALLEL_TASKS}" }

## END typst tasks
