[env]
# Template source for `wsa`, split on spaces into cargo-generate args.
# Local template checkout: RT_TEMPLATE="--path /abs/path/to/rust_template"
RT_TEMPLATE = { value = "--git https://github.com/MrDwarf7/rust_template --branch cargo-generate", condition = { env_not_set = [
  "RT_TEMPLATE",
] } }
# "<prefix>-" when CRATE_PREFIX is non-empty, else "".
WSA_NAME_PREFIX = { source = "${CRATE_PREFIX}", default_value = "${CRATE_PREFIX}-", mapping = { "" = "" } }

# WorkSpace Add: cargo make wsa <name>  ->  crates/<prefix>-<name>
# Pass the bare name; the prefix is added from CRATE_PREFIX (Makefile.toml).
[tasks.wsa]
description = "Add a library member crate: cargo make wsa <name>"
workspace = false
condition = { env_true = [
  "CARGO_MAKE_CRATE_IS_WORKSPACE",
], env_not = { CARGO_MAKE_TASK_ARGS = "" }, fail_message = "usage: cargo make wsa <name> (from the workspace root)" }
command = "cargo"
args = [
  "generate",
  "@@split(RT_TEMPLATE, )",
  "ws_crate",
  "--name",
  "${WSA_NAME_PREFIX}${CARGO_MAKE_TASK_ARGS}",
  "--destination",
  "crates",
  "--define",
  "crate_prefix=${CRATE_PREFIX}",
  "--define",
  "perf_testing=${PERF_TESTING}",
  "--define",
  "agent_support=${AGENT_SUPPORT}",
  "--silent",
]
