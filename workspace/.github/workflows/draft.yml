name: "Draft"
on:
  push:
    branches:
      - "master"
      - "main"
    tags: ["v[0-9]+.[0-9]+.[0-9]?"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "{% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}"
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}

env:
  NIGHTLY_BODY: "{% raw %}${{ github.event.release.body }}{% endraw %}"
  LICENSE_FILE_REG: "LICENS*|LICENSE-*|LICENSE-MIT|LICENSE-APACHE"
  LICENSE_FILES_WINDOWS: "LICENSE*"
  GITHUB_BRANCH_TAG_NAME: "{% raw %}${{ github.ref_name }}{% endraw %}"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  PROJECT_NAME: "{{ crate_name }}"

jobs:
  build-unix:
    name: "Draft - build-unix"
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup mbx"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          backend: "local"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"
      - name: "Build"
        shell: "bash"
        run: |
          export ARTIFACT_NAME="{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}"
          export LICENSE_FILE="{% raw %}${{ env.LICENSE_FILE_REG }}{% endraw %}"
          cargo make ci-build-release -- --target "{% raw %}${{ matrix.target }}{% endraw %}"
          mkdir -p "${ARTIFACT_NAME}"
          cp "target/{% raw %}${{ matrix.target }}{% endraw %}/release/{% raw %}${{ env.PROJECT_NAME }}{% endraw %}" "${ARTIFACT_NAME}"
          find . -maxdepth 1 -type f -regex ".*\(${LICENSE_FILE}\)" -exec sh -c 'cp README.md "$@" "${ARTIFACT_NAME}"' _ {} +
          cd "${ARTIFACT_NAME}"
          zip -r "../${ARTIFACT_NAME}.zip" .
          cd ..

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}"
          path: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}.zip"
          if-no-files-found: "error"
          compression-level: 9

  build-windows:
    name: "Draft - build-windows"
    strategy:
      matrix:
        include:
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup mbx"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          backend: "local"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"

      - name: "Build"
        run: "cargo make ci-build-release -- --target {% raw %}${{ matrix.target }}{% endraw %}"

      - name: "Pack artifact"
        shell: "powershell"
        working-directory: "{% raw %}${{ github.workspace }}{% endraw %}"
        run: |
          $ARTIFACT_NAME="{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}"
          $LICENSE_FILE="{% raw %}${{ env.LICENSE_FILES_WINDOWS }}{% endraw %}"
          New-Item -ItemType Directory -Path "$ARTIFACT_NAME"
          Copy-Item -Path "target\\{% raw %}${{ matrix.target }}{% endraw %}\\release\\{% raw %}${{ env.PROJECT_NAME }}{% endraw %}.exe" -Destination "$ARTIFACT_NAME"
          Copy-Item -Path "README.md", "$LICENSE_FILE" -Destination "$ARTIFACT_NAME"
          Compress-Archive -Path "$ARTIFACT_NAME\\*" -Destination "$ARTIFACT_NAME.zip"

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}"
          path: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-{% raw %}${{ env.GITHUB_BRANCH_TAG_NAME }}{% endraw %}.zip"
          if-no-files-found: "error"
          compression-level: 9

  draft:
    name: "Draft - draft"
    if: {% raw %}${{ startsWith(github.ref, 'refs/tags/') }}{% endraw %}
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [build-unix, build-windows]
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        id: "artifact-download-step"
        with:
          merge-multiple: true

      - name: "Draft"
        uses: "softprops/action-gh-release@v3"
        with:
          fail_on_unmatched_files: true
          draft: true
          files: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-*"
          generate_release_notes: true

  nightly:
    name: "Draft - nightly"
    if: {% raw %}${{ !startsWith(github.ref, 'refs/tags/') }}{% endraw %}
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [build-unix, build-windows]
    steps:
      - name: "Generate nightly body"
        run: |
          echo 'NIGHTLY_BODY<<EOF' >> $GITHUB_ENV
          echo "From commit: ${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "Generated on: $(date -u +\"%Y-%m-%d %H:%M\") UTC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        with:
          merge-multiple: true

      # Recreate floating nightly via API (no git push --force; no workflows scope).
      # gh release delete --cleanup-tag drops release + tag; softprops recreates both.
      - name: "Drop existing nightly release and tag"
        env:
          GH_TOKEN: "{% raw %}${{ github.token }}{% endraw %}"
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" 2>/dev/null || true

      - name: "Release Nightly"
        uses: "softprops/action-gh-release@v3"
        with:
          tag_name: "nightly"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-*"
          name: "Nightly Build"
          body: "{% raw %}${{ env.NIGHTLY_BODY }}{% endraw %}"
          target_commitish: "{% raw %}${{ github.sha }}{% endraw %}"
