name: "Docs - Check & Generation"
on:
  push:
    branches:
      - "master"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "{% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}"
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}

env:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  PROJECT_NAME: "{{ crate_name }}"

jobs:
  docs:
    name: "Docs - {% raw %}${{ matrix.target }}{% endraw %}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup mbx cache"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          cache-key-suffix: "-{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"

      - name: "Run Cargo Doc checks"
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: "cargo make ci-doc -- --target {% raw %}${{ matrix.target }}{% endraw %}"

  package-docs-unix:
    name: "Docs - package-docs-unix"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup mbx cache"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          cache-key-suffix: "-{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"

      - name: "Run Cargo Doc generation"
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: "cargo make ci-doc -- --target {% raw %}${{ matrix.target }}{% endraw %}"

      - name: "Ensure Zip Installed on Unix"
        run: |
          if ! command -v zip &> /dev/null
          then
              sudo apt-get install zip
          fi
          zip --version

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-docs.zip"
          path: "target/{% raw %}${{ matrix.target }}{% endraw %}/doc/"
          if-no-files-found: "error"
          compression-level: 9
          overwrite: true

  package-docs-windows:
    name: "Docs - package-docs-windows"
    strategy:
      matrix:
        include:
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup mbx cache"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          cache-key-suffix: "-{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"

      - name: "Run Cargo Doc generation"
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: "cargo make ci-doc -- --target {% raw %}${{ matrix.target }}{% endraw %}"

      - name: "Upload artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-{% raw %}${{ matrix.target }}{% endraw %}-docs.zip"
          path: "target\\{% raw %}${{ matrix.target }}{% endraw %}\\doc\\"
          if-no-files-found: "error"
          compression-level: 9
          overwrite: true

  publish-docs:
    name: "Docs - publish-docs"
    permissions:
      contents: write
    runs-on: "ubuntu-latest"
    needs: [package-docs-unix, package-docs-windows]
    steps:
      - name: "Generate docs body"
        run: |
          echo 'DOCS_BODY<<EOF' >> $GITHUB_ENV
          echo "From commit: ${GITHUB_SHA:0:8}" >> $GITHUB_ENV
          echo "Generated on: $(date -u +\"%Y-%m-%d %H:%M\") UTC" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Download artifacts"
        uses: "actions/download-artifact@v8"
        id: "artifact-download-step"
        with:
          path: "docs-artifacts"
          merge-multiple: true

      - name: "Get directory structure"
        shell: "bash"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tree zip
          echo "PWD=$PWD"
          tree -afh docs-artifacts || ls -laR docs-artifacts

      - name: "Zip - Documentation"
        shell: "bash"
        run: |
          cd docs-artifacts
          zip -r "../{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-docs.zip" .
          cd ..
          ls -la "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-docs.zip"

      # Recreate floating docs tag via API (no git push --force; no workflows scope).
      - name: "Drop existing docs release and tag"
        env:
          GH_TOKEN: "{% raw %}${{ github.token }}{% endraw %}"
        run: |
          gh release delete docs --yes --cleanup-tag 2>/dev/null || true
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/docs" 2>/dev/null || true

      - name: "Docs - draft"
        uses: "softprops/action-gh-release@v3"
        with:
          tag_name: "docs"
          fail_on_unmatched_files: true
          draft: true
          make_latest: false
          files: "{% raw %}${{ env.PROJECT_NAME }}{% endraw %}-docs.zip"
          name: "[{% raw %}${{ github.ref_name }}{% endraw %} Docs]"
          body: "{% raw %}${{ env.DOCS_BODY }}{% endraw %}"
          target_commitish: "{% raw %}${{ github.sha }}{% endraw %}"
          generate_release_notes: false
