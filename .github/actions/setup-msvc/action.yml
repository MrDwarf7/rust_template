name: "Setup MSVC"
description: "Setup MSVC toolchain (ilammy/msvc-dev-cmd) and fix Git Bash shadowing of link.exe. Windows only; no-op on other runners."

inputs:
  arch:
    description: "MSVC architecture (e.g. x64, x86)"
    required: false
    default: "x64"

runs:
  using: "composite"
  steps:
    - name: "Setup MSVC (msvc-dev-cmd)"
      if: "${{ runner.os == 'Windows' }}"
      uses: "ilammy/msvc-dev-cmd@v1"
      with:
        arch: "${{ inputs.arch }}"

    # Git for Windows ships C:\Program Files\Git\usr\bin\link.exe (MSYS)
    # which shadows MSVC's link.exe on PATH and breaks cl.exe linking.
    # Remove that entry. Must run after msvc-dev-cmd.
    - name: "Remove Git usr/bin from PATH (Windows)"
      if: "${{ runner.os == 'Windows' }}"
      shell: "bash"
      run: |
        # Windows PATH is semicolon-delimited; filter case-insensitively.
        # Do NOT split on ':' - that breaks drive letters like C:\.
        filtered="$(printf '%s' "$PATH" | tr ';' '\n' | { grep -iv 'Git.*usr.bin' || true; } | paste -sd ';' -)"
        echo "PATH=$filtered" >> "$GITHUB_ENV"
        printf "Filtered Git usr/bin from PATH (entries: %s -> %s)\n" "$(printf '%s' "$PATH" | tr ';' '\n' | wc -l)" "$(printf '%s' "$filtered" | tr ';' '\n' | wc -l)"
