name: "Setup MSVC"
description: "Setup MSVC toolchain (ilammy/msvc-dev-cmd) and fix Git Bash shadowing of link.exe. Windows only; no-op on other runners. Pair with setup-rust for Rust+MSVC builds."

inputs:
  arch:
    description: "MSVC architecture (e.g. x64, x86, x64_x86)"
    required: false
    default: "x64"

runs:
  using: "composite"
  steps:
    - name: "Setup MSVC (msvc-dev-cmd)"
      if: "${{ runner.os == 'Windows' }}"
      uses: "ilammy/msvc-dev-cmd@v1"
      with:
        arch: "${{ inputs.arch }}"

    # Git for Windows ships C:\Program Files\Git\usr\bin\link.exe (MSYS)
    # which shadows MSVC's link.exe on PATH and breaks cl.exe linking.
    # Remove that entry. Must run after msvc-dev-cmd. Keep it in bash
    # so the action is maintainable as plain shell, not pwsh.
    - name: "Remove Git usr/bin from PATH (Windows)"
      if: "${{ runner.os == 'Windows' }}"
      shell: "bash"
      run: |
        # Filter Git\usr\bin regardless of Program Files location / slash style
        filtered="$(printf '%s' "$PATH" | tr ';' '\n' | tr ':' '\n' | grep -iv 'Git.*usr.bin' | paste -sd ';' -)"
        if [ -z "$filtered" ]; then
          filtered="$(printf '%s' "$PATH" | tr ';' '\n' | grep -iv 'Git.*usr.bin' | paste -sd ';' -)"
        fi
        echo "PATH=$filtered" >> "$GITHUB_ENV"
        printf "Filtered Git usr/bin from PATH\n"
