[package]
name        = "{{ crate_name }}"
version     = "0.1.0"
authors     = [ "{{ authors }}" ]
edition     = "2024"
description = "{{ short_description_toml }}"
license      = "MIT"
{% if crate_type == "bin" %}
build        = "build.rs"
{% endif %}
# For running the main server as a watch, call
# cargo watch -q -c -w src/ -x run

######################################################################################################################################################
######################################################################################################################################################

[features]
default = [ "macros" ]
macros  = [  ]
# debug   = [  ]

{% if crate_type == "bin" %}
# Windows exe icon + version info (release builds). Assets under assets/icon.ico.
[package.metadata.winresource]
OriginalFilename = "{{ crate_name }}.exe"
FileDescription  = "{{ short_description_toml }}"
LegalCopyright   = "Copyright (c) {{ github_user_toml }}"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.19"
{% endif %}

######################################################################################################################################################
######################################################################################################################################################


[dependencies]
