######################################################################################################################################################
######################################################################################################################################################


## Profiles and cargo-features belong in the workspace root Cargo.toml;
## Cargo ignores them in member manifests.

######################################################################################################################################################
######################################################################################################################################################

# Lint levels / priorities/priority
# 0 = forbid
# 1 = deny
# 2 = warn
# 3 = allow
[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
# unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = { level = "warn", priority = 2 }
