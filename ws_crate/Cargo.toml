[package]
name        = "{{ project-name }}"
version     = "0.1.0"
authors     = [ "{{ authors }}" ]
edition     = "2024"
description = "{{ short_description_toml }}"
license     = "MIT"

######################################################################################################################################################
######################################################################################################################################################

[features]
default = [ "macros" ]
macros  = [  ]
# debug   = [  ]


