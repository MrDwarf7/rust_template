[template]
cargo_generate_version = ">=0.24.0"
vcs = "None"

[hooks]
pre = ["../hooks/toml.rhai"]
post = ["../hooks/ws_crate/post.rhai"]

[placeholders]
github_user = { type = "string", prompt = "GitHub user/org for URLs?", default = "MrDwarf7" }
short_description = { type = "string", prompt = "Short description (Cargo.toml / crates.io)?", default = "A workspace member crate" }

[conditional.'crate_type == "lib"']
ignore = ["src/main.rs", "build.rs", "assets"]

[conditional.'crate_type == "bin"']
ignore = ["src/lib.rs"]
