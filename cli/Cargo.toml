{% if has_cranelift -%}
# Cranelift is nightly-only (needs the rustc-codegen-cranelift-preview component).
# Add "profile-rustflags" here to use `rustflags` in the profiles below.
cargo-features = [ "codegen-backend" ]

{% endif -%}
[package]
name        = "{{ crate_name }}"
version     = "0.1.0"
authors     = [ "{{ authors }}" ]
edition     = "2024"
description = "{{ short_description_toml }}"
# license = "MIT"
license-file = "LICENSE"
readme       = "README.md"
build        = "build.rs"
# For running the main server as a watch, call
# cargo watch -q -c -w src/ -x run

######################################################################################################################################################
######################################################################################################################################################

[features]
default = [ "macros" ]
macros  = [  ]
# debug   = [  ]

# Windows exe icon + version info (release builds). Assets under assets/icon.ico.
[package.metadata.winresource]
OriginalFilename = "{{ crate_name }}.exe"
FileDescription  = "{{ short_description_toml }}"
LegalCopyright   = "Copyright (c) {{ github_user_toml }}"
#CompanyName = "https://github.com/{{ github_user_toml }}"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.19"

######################################################################################################################################################
######################################################################################################################################################


[dependencies]
# eyre = "*"
# dotenvy = "*"
# futures = "*"
#
# clap = { version = "*", features = [ "derive" ] } # Optionall: "env"
# anstyle = "*"

# Base dependencies/Commons
# reqwest = { version = "*", features = ["cookies", "json", "multipart", "stream"] }
# uuid = { version = "*", features = ["v4"] }
# serde = { version = "*", features = ["derive"] }
# serde_json = "*"
thiserror = "*"
# tokio = { version = "*", features = ["full", "tracing"] }

# Logging and tracing
# tracing = "*"
# tracing-subscriber = { version = "*", features = [
#     "ansi",
#     "chrono",
#     "env-filter",
#     "serde",
#     "std",
# ] }


# Extra stuff
# tokio-util = { version = "*", features = ["codec"] }
# toml = "*"
# dirs = "*" # Useful to get XDG spec dirs

# Utilities
# async-trait = "*"
# static-toml = "*"
# walkdir = "*"
# chrono = "*"
# itertools = "*"

######################################################################################################################################################
######################################################################################################################################################


## See `./.cargo_options.toml` for options & brief details & directions

[profile.dev]
opt-level        = 1
codegen-units    = 256
incremental      = true
{% if has_cranelift -%}
codegen-backend  = "cranelift"
{% endif -%}
debug            = "line-tables-only"
debug-assertions = true
overflow-checks  = true
strip            = "none"             # true | false | "none" | "symbols" | "debuginfo" ## Leave off @ w. THIS IS NOT OBFUSCATION.
panic            = "abort"            # "unwind" | "abort"
lto              = "off"              # "false" | "off" | "thin" | "fat"
{% if use_trim_paths -%}
trim-paths       = "none"             # "none" | "object" | "all" -- keep local paths while developing
{% endif -%}
# rustflags        = ["-Zthreads=16"]
# tune-cpu         = "native"

######################################################################################################################################################

[profile.release]
opt-level        = 3
codegen-units    = 1
incremental      = false
debug            = "none"
debug-assertions = false
overflow-checks  = false     # debatable
strip            = "symbols" # true | false | "none" | "symbols" | "debuginfo" ## Leave off @ w. THIS IS NOT OBFUSCATION.
panic            = "unwind"
lto              = "off"     # true | false | "off" | "thin" | "fat"
{% if use_trim_paths -%}
trim-paths       = "object"                    # "none" | "object" | "all" -- sanitize paths in shipped binaries
{% endif -%}
# rustflags        = ["-Zthreads=16"]
# tune-cpu         = "native"


[profile.dev.package."*"]
opt-level       = 3
{% if has_cranelift -%}
codegen-backend = "llvm"
{% endif -%}

######################################################################################################################################################
######################################################################################################################################################

# Lint levels / priorities/priority
# 0 = forbid
# 1 = deny
# 2 = warn
# 3 = allow
[lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
# unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = { level = "warn", priority = 2 }
