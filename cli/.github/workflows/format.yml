name: "Formatting"
on:
  push:
    branches:
      - "master"
      - "main"
      - "develop"
      - "dev"
  workflow_dispatch:

concurrency:
  group: "{% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}"
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}

env:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  PROJECT_NAME: "{{ crate_name }}"

jobs:
  format-lint:
    name: "Formatting - {% raw %}${{ matrix.target }}{% endraw %}"
    strategy:
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    if: {% raw %}${{ !contains(github.event.head_commit.message, 'skip ci') }}{% endraw %}
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"

      - name: "Setup nightly rustfmt"
        uses: "./.github/actions/setup-rust"
        with:
          toolchain: "nightly"
          components: "rustfmt"
          tools: ""
          use-mold: "false"
          set-default: "false"

      - name: "Run Cargo fmt"
        env:
          RUSTUP_TOOLCHAIN: "nightly"
        run: "cargo fmt --all --check"

      - name: "Build project"
        run: "cargo build --release --locked --all"
