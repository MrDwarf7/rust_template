name: "Build - Check & Clippy"
on:
  push:
    branches:
      - "master"
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "{% raw %}${{ github.workflow }}{% endraw %}-{% raw %}${{ github.ref }}{% endraw %}"
  cancel-in-progress: {% raw %}${{ github.ref != 'refs/heads/main' }}{% endraw %}

env:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  PROJECT_NAME: "{{ crate_name }}"

jobs:
  check:
    name: "Build - check"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            recipe: "ci-format"
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            recipe: "ci-check"
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
            recipe: "ci-clippy"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            recipe: "ci-check"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            recipe: "ci-clippy"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    if: {% raw %}${{ !contains(github.event.head_commit.message, 'skip ci') }}{% endraw %}
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup nightly rustfmt"
        if: {% raw %}${{ matrix.recipe == 'ci-format' }}{% endraw %}
        uses: "./.github/actions/setup-rust"
        with:
          toolchain: "nightly"
          components: "rustfmt"
          set-default: "false"
      - name: "Setup mbx cache"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          cache-key-suffix: "-{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"
      - name: "Install taplo"
        if: {% raw %}${{ matrix.recipe == 'ci-format' }}{% endraw %}
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "taplo"
      - name: "Run formatting recipe"
        if: {% raw %}${{ matrix.recipe == 'ci-format' }}{% endraw %}
        run: "cargo make ci-format"
      - name: "Run build recipe"
        if: {% raw %}${{ matrix.recipe != 'ci-format' }}{% endraw %}
        run: "cargo make {% raw %}${{ matrix.recipe }}{% endraw %} -- --target {% raw %}${{ matrix.target }}{% endraw %}"

  clippy:
    name: "Build - clippy"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "ubuntu-latest"
            target: "x86_64-unknown-linux-gnu"
          - os: "windows-latest"
            target: "x86_64-pc-windows-msvc"
    runs-on: "{% raw %}${{ matrix.os }}{% endraw %}"
    if: {% raw %}${{ !contains(github.event.head_commit.message, 'skip ci') }}{% endraw %}
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v7"

      - name: "Setup Rust"
        uses: "./.github/actions/setup-rust"
        with:
          target: "{% raw %}${{ matrix.target }}{% endraw %}"
      - name: "Setup nightly rustfmt"
        uses: "./.github/actions/setup-rust"
        with:
          toolchain: "nightly"
          components: "rustfmt"
          set-default: "false"
      - name: "Setup mbx cache"
        uses: "jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240" # v1
        with:
          cache-key-suffix: "-{% raw %}${{ matrix.target }}{% endraw %}"

      - name: "Install cargo-make"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "cargo-make"
      - name: "Install taplo"
        uses: "taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283" # v2.87.29
        with:
          tool: "taplo"
      - name: "Run CI formatting check"
        env:
          RUSTUP_TOOLCHAIN: "nightly"
        run: "cargo make ci-format"
      - name: "Run Clippy with pedantic"
        run: "cargo make ci-clippy-pedantic"
      - name: "Build project"
        run: "cargo make ci-build-release -- --target {% raw %}${{ matrix.target }}{% endraw %}"
