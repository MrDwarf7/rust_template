name: "Setup Rust"
description: "Standard Rust CI setup: rustup toolchain (from rust-toolchain.toml), GCC/Clang and components. Does NOT checkout -- call ./.github/actions/checkout first."

inputs:
  target:
    description: "Target triple (e.g. x86_64-unknown-linux-gnu)"
    required: false
    default: ""
  toolchain:
    description: "Rust toolchain channel (e.g. nightly, stable). Reads rust-toolchain.toml if empty."
    required: false
    default: ""
  components:
    description: "Comma-separated rustup components (e.g. clippy,rustfmt). Reads rust-toolchain.toml if empty."
    required: false
    default: ""
  set-default:
    description: "Set installed toolchain as default (disable for side-by-side nightly rustfmt)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:

    - name: "Install Clang and gcc"
      shell: "bash"
      if: "{% raw %}${{ contains(inputs.target, 'linux') }}{% endraw %}"
      run: |
        sudo apt update
        sudo apt install -yq clang
        case "{% raw %}${{ inputs.target }}{% endraw %}" in
          aarch64-unknown-linux-gnu) sudo apt install -yq gcc-aarch64-linux-gnu ;;
          armv7-unknown-linux-gnueabihf) sudo apt install -yq gcc-arm-linux-gnueabihf ;;
          x86_64-unknown-linux-gnu) sudo apt install -yq gcc-x86-64-linux-gnu ;;
        esac


    - name: "Setup Rust toolchain"
      shell: "bash"
      run: |
        if [ -n "{% raw %}${{ inputs.toolchain }}{% endraw %}" ]; then
          rustup toolchain install "{% raw %}${{ inputs.toolchain }}{% endraw %}" --profile minimal
          if [ "{% raw %}${{ inputs.set-default }}{% endraw %}" = "true" ]; then
            rustup default "{% raw %}${{ inputs.toolchain }}{% endraw %}"
          fi
        else
          rustup toolchain install
        fi
        if [ -n "{% raw %}${{ inputs.target }}{% endraw %}" ]; then
          rustup target add "{% raw %}${{ inputs.target }}{% endraw %}" 2>/dev/null || true
        fi
        rustup show

    - name: "Install components"
      shell: "bash"
      if: "{% raw %}${{ inputs.components != '' }}{% endraw %}"
      run: |
        if [ -n "{% raw %}${{ inputs.toolchain }}{% endraw %}" ]; then
          components=$(echo "{% raw %}${{ inputs.components }}{% endraw %}" | tr -d ' ' | tr ',' ' ') # spaces first, then , -> space
          rustup component add --toolchain "{% raw %}${{ inputs.toolchain }}{% endraw %}" $components
        else
          rustup component add {% raw %}${{ inputs.components }}{% endraw %}
        fi
