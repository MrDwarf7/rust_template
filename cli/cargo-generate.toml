[template]
cargo_generate_version = ">=0.24.0"
# Do not auto git-init; the post hook honors vcs_kind (jj | git | none).
vcs = "None"
# Template-only files. Template logos/icons are dropped via .genignore.
ignore = ["Cargo.lock", ".extras"]


# Shared hooks live in ../hooks (repo root), resolved from this folder.
# github_user, linker, repo suffix and the README/description text are
# derived in hooks (see README "Placeholders"), not prompted here.
[hooks]
pre = ["../hooks/details.rhai", "../hooks/pre.rhai", "../hooks/toml.rhai"]
post = ["../hooks/finish.rhai"]

# Shared prompts come first, in the same order in every sub-template.
[placeholders]
keep_bacon = { type = "bool", prompt = "Keep bacon.toml?", default = true }
keep_dev_dirs = { type = "bool", prompt = "Keep the data/ and scratch/ folders? (useful for dev work)", default = false }
perf_testing = { type = "bool", prompt = "Set up performance testing (criterion benches in perf/, hotpath via mise)?", default = false }
agent_support = { type = "bool", prompt = "Will you use a coding agent (Claude Code, oh-my-pi, opencode)? Adds AGENTS.md and .agents/ skills.", default = true }
use_trim_paths = { type = "bool", prompt = 'Strip local paths from release binaries? (trim-paths = "object")', default = true }
vcs_kind = { type = "string", prompt = "Initialize VCS?", choices = [
  "jj",
  "git",
  "none",
], default = "jj" }

[conditional.'!keep_bacon']
ignore = ["bacon.toml"]

[conditional.'!keep_dev_dirs']
ignore = ["data", "scratch"]

[conditional.'!perf_testing']
ignore = [
  "perf",
  ".agents/skills/hotpath-init",
  ".agents/skills/hotpath-cloud",
  ".agents/skills/hotpath-init-ci",
  ".agents/skills/hotpath-init-ci-forks",
]

[conditional.'!agent_support']
ignore = ["AGENTS.md", "CLAUDE.md", ".agents", "docs/00_AGENT_DOCS_SETUP.md"]
