[template]
cargo_generate_version = ">=0.24.0"
# Do not auto git-init; the post hook honors vcs_kind (jj | git | none).
vcs = "None"
# Template-only files. Template logos/icons are dropped via .genignore.
ignore = ["Cargo.lock", ".extras"]

# Shared hooks live in ../hooks (repo root), resolved from this folder.
[hooks]
init = ["../hooks/init.rhai"]
pre = ["../hooks/pre.rhai", "../hooks/toml.rhai"]
post = ["../hooks/finish.rhai"]

[placeholders]
github_user = { type = "string", prompt = "GitHub user/org for URLs?", default = "MrDwarf7" }
use_rs_suffix = { type = "bool", prompt = "Append .rs to the GitHub repo name?", default = true }
tagline = { type = "string", prompt = "One-line tagline?", default = "Rust CLI" }
short_description = { type = "string", prompt = "Short description (Cargo.toml / crates.io)?", default = "A Rust CLI" }
long_description = { type = "string", prompt = "Longer README description?", default = "A Rust CLI scaffolded from rust_template." }
keep_bacon = { type = "bool", prompt = "Keep bacon.toml?", default = true }
keep_data = { type = "bool", prompt = "Keep data/?", default = false }
keep_scratch = { type = "bool", prompt = "Keep scratch/?", default = false }
use_cranelift = { type = "bool", prompt = "Use the Cranelift codegen backend? (nightly; faster builds, can break some deps)", default = false }
use_trim_paths = { type = "bool", prompt = 'Strip local paths from release binaries? (trim-paths = "object")', default = false }
vcs_kind = { type = "string", prompt = "Initialize VCS?", choices = [
  "jj",
  "git",
  "none",
], default = "jj" }

# is_linux / has_* are set by ../hooks/init.rhai before prompting.
[conditional.'is_linux'.placeholders]
linker = { type = "string", prompt = "Linker for Linux targets? (default = rustc's own choice)", choices = [
  "default",
  "lld",
  "bfd",
  "mold",
  "gold",
], default = "default" }

[conditional.'!has_cargo_make && !has_taplo'.placeholders]
install_tools = { type = "array", prompt = "cargo-make and taplo run this project's build system (see Makefile.toml) but are not installed. Tick any to install now", choices = [
  "cargo-make",
  "taplo",
], default = [
] }

[conditional.'!has_cargo_make && has_taplo'.placeholders]
install_tools = { type = "array", prompt = "cargo-make runs this project's build system (see Makefile.toml) but is not installed. Tick to install now", choices = [
  "cargo-make",
], default = [
] }

[conditional.'has_cargo_make && !has_taplo'.placeholders]
install_tools = { type = "array", prompt = "taplo (TOML formatter) is part of this project's build system (see Makefile.toml) but is not installed. Tick to install now", choices = [
  "taplo",
], default = [
] }

[conditional.'!keep_bacon']
ignore = ["bacon.toml"]

[conditional.'!keep_data']
ignore = ["data"]

[conditional.'!keep_scratch']
ignore = ["scratch"]
